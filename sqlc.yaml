version: "2"
sql:
  - schema: "schema/migrations"
    queries: "schema/queries"
    engine: "postgresql"
    gen:
      go:
        out: "internal/database"
        sql_package: "pgx/v5"
        sql_driver: github.com/jackc/pgx/v5
        emit_db_tags: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "messages.metadata"
            go_type:
              type: "[]Metadata"
          - column: "agent_flows.config"
            go_type:
              type: "AgentFlowConfig"
          - column: "research.report"
            go_type:
              type: "StockReport"
