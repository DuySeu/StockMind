<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockMind — AI Vietnamese Market Assistant</title>
    <meta
      name="description"
      content="Ask about HOSE and HNX tickers in Vietnamese or English. StockMind reads filings, prices and news, and answers with its sources."
    />
    <meta name="theme-color" content="#f4f5fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080f" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="StockMind — AI Vietnamese Market Assistant" />
    <meta
      property="og:description"
      content="Ask about HOSE and HNX tickers in Vietnamese or English. StockMind reads filings, prices and news, and answers with its sources."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StockMind — AI research for the Vietnamese market." />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Manrope carries the UI, JetBrains Mono carries prices and figures.
         Both ship the Google Fonts `vietnamese` subset, so diacritics are not
         dropped or substituted. Check that subset before swapping either one.
         Mapped to --font-sans / --font-mono in src/index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
